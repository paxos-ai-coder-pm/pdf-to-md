[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2md"
version = "0.1.0"
description = "Convert PDF files to Markdown - CLI and local web UI"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
dependencies = ["pymupdf4llm>=0.0.17"]

[project.scripts]
pdf2md = "pdf2md.cli:main"
pdf2md-web = "pdf2md.server:main"

[tool.setuptools]
packages = ["pdf2md"]

[tool.setuptools.package-data]
pdf2md = ["static/*.html"]
